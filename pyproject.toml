[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathproblembank"
version = "0.1.0rc1"
description = "A local-first Windows workbench for advanced mathematical study"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "lxml>=5,<7",
  "markdown-it-py>=3,<5",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "pydantic>=2.8,<3",
  "Pygments>=2.17,<3",
  "pypinyin>=0.51,<1",
  "sympy>=1.12,<2",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
pdf = ["pypdf>=4,<7"]
video = ["scenedetect>=0.6,<1", "openai-whisper>=20231117"]
wolfram = ["wolframclient>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
namespaces = true

name: public-release-gate

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Compile allowlisted source roots
        run: python shared/scripts/public_regression_core.py --static-only
      - name: Run public release tests
        run: python -m unittest shared.scripts.test_release_engineering

  core-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Run public core regression subset
        run: python shared/scripts/public_regression_core.py

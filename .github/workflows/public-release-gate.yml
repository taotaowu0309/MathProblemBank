name: public-release-gate

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Report optional XeLaTeX availability
        shell: pwsh
        run: |
          $xelatex = Get-Command xelatex -ErrorAction SilentlyContinue
          if ($null -eq $xelatex) {
            Write-Host "XeLaTeX is not installed on this hosted runner; PDF E2E remains a separate environment check."
          } else {
            xelatex --version | Select-Object -First 1
          }
      - name: Compile allowlisted source roots
        run: python shared/scripts/public_regression_core.py --static-only
      - name: Run public release tests
        run: python -m unittest shared.scripts.test_release_engineering

  core-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Build isolated public release
        shell: pwsh
        run: python tools/build_public_release.py --output "$env:RUNNER_TEMP\mpb-public-release"
      - name: Run public core regression subset
        shell: pwsh
        run: |
          $publicRoot = Join-Path $env:RUNNER_TEMP "mpb-public-release"
          $dataRoot = Join-Path $env:RUNNER_TEMP "mpb-public-data"
          $env:MATH_PROBLEM_BANK_PUBLIC_RELEASE = "1"
          $env:MATH_PROBLEM_BANK_DATA_ROOT = $dataRoot
          $env:PYTHONPATH = $publicRoot
          Push-Location $publicRoot
          try {
            python shared/scripts/public_regression_core.py
          } finally {
            Pop-Location
          }
